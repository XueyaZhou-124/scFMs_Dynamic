model: scfoundation
task_name: EMT

data:
  input_path: data/raw/EMT/raw.h5ad

external:
  homo_path: /personal/scFMs_dynamic/data/external/scFoundation/homo_id.txt # 同源基因转换的数据，只有当物种非人时使用
  gene_list_path: /personal/scFMs_dynamic/data/external/scFoundation/OS_scRNA_gene_index.19264.tsv # scFoundation特有

preprocess:
  gene_key: name
  species: human

embedding: # 参考scfoundation参数设置
  model_path: '/macroverse/public/zhouxy/pretrained_models/scFoundation/model/models/models.ckpt' # ckpt path
  pre_normalized: F # 数据是否进行过normalized
  select_col: ["Time", "Phase"] # 需要保存哪些列的meta信息, 如果为空保存所有obs信息

evaluate:  
  emb_dim: 768
  labels: ['Phase', 'Time']
  umap_keys: ['Phase', 'Time']
  batch_key: 'Phase'

